/* Forms and dialogs preserve full-size controls on mobile. */
.overlay { position: fixed; inset: 0; background: #1e2b4666; backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fade .15s; }

.pending-plan-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 0; }

.field { display: block; margin-bottom: 21px; min-width: 0; }

.field input, .field select, .field textarea { width: 100%; border: 1px solid #cbd6e6; border-radius: 8px; background: white; color: #3b5275; padding: 11px 12px; outline: 0; font-size: 16px; min-height: 46px; }
.field textarea { resize: vertical; min-height: 100px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: #7995e7; box-shadow: 0 0 0 3px #edf1ff; }
.field input:disabled, .field select:disabled, .field textarea:disabled { background: #f3f5f9; color: #59677e; }
.field small { display: block; font-size: 14px; color: #667b9a; margin-top: 7px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }

.form-section > p { font-size: 14px; color: #647897; margin: 6px 0 15px; }
.form-section .field:last-child { margin-bottom: 0; }
.checkbox-field { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 9px 0; font-size: 16px; color: #455f83; cursor: pointer; }
.checkbox-field input { flex: 0 0 20px; width: 20px; height: 20px; margin-top: 4px; accent-color: var(--blue); }
.checkbox-field small { display: block; font-size: 14px; color: #657a99; margin-top: 5px; }
.notice { background: #f0f4fd; border: 1px solid #dce5f7; color: #526c95; border-radius: 9px; padding: 15px 17px; font-size: 14px; line-height: 1.9; margin-bottom: 21px; }
.notice strong { color: #3e609a; font-weight: 600; }
.notice.warning { background: #fff8e9; border-color: #ead7ae; color: #87601b; }
.notice.warning strong { color: #785414; }
.form-error { color: #b53c46; font-size: 16px; margin-top: 14px; }
.publish-summary { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 22px; overflow: hidden; }
.publish-summary > div { padding: 17px 12px; text-align: center; border-right: 1px solid var(--border); }
.publish-summary > div:last-child { border: 0; }
.publish-summary strong { display: block; font-size: 28px; font-weight: 600; color: #46659f; }
.publish-summary small { font-size: 14px; color: #607796; }
.diff-row { padding: 14px 0; border-bottom: 1px solid #e4eaf4; display: flex; justify-content: space-between; gap: 20px; font-size: 16px; overflow-wrap: anywhere; }
.diff-row .diff-values { text-align: right; color: #526e9a; }
.diff-values del { color: #6b7f9f; margin-right: 10px; }
.diff-values b { font-weight: 600; color: #4968c2; }
.confirm-check { display: flex; align-items: flex-start; gap: 11px; font-size: 16px; color: #4c6488; margin-top: 22px; min-height: 44px; cursor: pointer; }
.confirm-check input { margin-top: 4px; accent-color: var(--blue); width: 20px; height: 20px; flex-shrink: 0; }
.section-label { font-size: 16px; font-weight: 550; color: #425c81; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 9px; flex-wrap: wrap; }
.detail-hero { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
.detail-hero .avatar { width: 54px; height: 54px; font-size: 20px; }
.detail-hero strong { display: block; font-size: 22px; font-weight: 600; }
.detail-hero p { font-size: 14px; color: #61799b; margin-top: 6px; }
.detail-meta { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 27px; gap: 19px; }
.detail-meta small { display: block; font-size: 14px; color: #637b9c; }
.detail-meta span { font-size: 16px; display: block; margin-top: 6px; }
.usage-card { border: 1px solid var(--border); padding: 16px 18px; border-radius: 10px; margin-bottom: 13px; }
.usage-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 16px; color: #486388; }
.usage-title b { font-size: 16px; color: #3d5e92; font-weight: 550; }
.usage-card .mini-track { width: 100%; height: 6px; margin: 13px 0; }
.usage-card .mini-track i { height: 6px; }
.usage-card p { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; color: #60799e; }
.detail-buttons { display: flex; gap: 11px; margin: 23px 0; flex-wrap: wrap; }
.detail-buttons .btn { flex: 1; }
.permission-list { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; font-size: 16px; color: #4b668e; }
.permission-list svg { width: 18px; height: 18px; margin-right: 6px; }
.permission-list .disabled { color: #6c7c93; }
.guide-list { display: grid; gap: 21px; }
.guide-list h3 { font-size: 18px; color: #3c587e; }
.guide-list p { font-size: 16px; color: #587294; margin-top: 7px; line-height: 1.9; }
#toast { position: fixed; bottom: 28px; left: calc(50% + var(--sidebar-width) / 2); transform: translate(-50%, 15px); z-index: 150; background: #26354b; color: white; border-radius: 10px; padding: 14px 22px; font-size: 16px; box-shadow: 0 7px 25px #13233d26; opacity: 0; pointer-events: none; transition: .2s; max-width: min(680px, 86vw); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.inline-checkbox { accent-color: var(--blue); width: 20px; height: 20px; vertical-align: middle; cursor: pointer; }
.rule-table { min-width: 1080px; }
.rule-table td { font-size: 16px; }
.rule-table .pending { color: #8d641f; }
.rule-note { line-height: 1.8; color: #576f91; font-size: 14px; }
.status-dot { height: 6px; width: 6px; border-radius: 50%; background: currentColor; }
.soft-label { color: #627b9e; font-size: 14px; font-weight: 400; }
.top-margin { margin-top: 24px; }
.row-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.version-text { font-size: 14px; color: #637c9e; }
.mobile-menu { display: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (min-width: 1700px) {
  main { padding-top: 36px; }
  .plan-card { padding: 25px; }
  .plan-stats > div { min-width: 110px; }
  td { padding-top: 20px; padding-bottom: 20px; }
}
@media (max-width: 1150px) {

  .sidebar { padding-left: 12px; padding-right: 12px; }

}
@media (max-width: 900px) {

  .brand { padding: 0; font-size: 28px; }

  .log-item { flex-wrap: wrap; }

}
@media (max-width: 560px) {

  nav { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 17px; }
  nav button { justify-content: flex-start; min-height: 46px; padding: 10px 12px; }
  .brand-caption { display: block; margin: 6px 0 0; }
  main { padding: 24px 14px; }
  .topbar { padding: 13px 16px; flex-wrap: wrap; gap: 10px; }
  .topbar-right { width: 100%; justify-content: space-between; }
  .breadcrumbs { font-size: 14px; gap: 8px; }
  .demo-pill { font-size: 14px; }
  #account-controls { gap: 7px; }
  #account-controls > span { max-width: 130px; }
  h1 { font-size: 28px; }
  .page-heading { gap: 18px; }
  .heading-actions { gap: 8px; }
  .heading-actions .btn { padding: 10px 12px; font-size: 16px; }
  .plan-grid { grid-template-columns: 1fr; }
  .plan-card { padding: 22px 18px 15px; }
  .plan-stats { gap: 16px 12px; }
  .panel-heading { padding: 20px 16px 16px; gap: 14px; }

  .info-banner > span { flex: 1; min-width: 0; }
  .info-banner button { margin-left: 30px; }
  .sync-status { padding: 15px; gap: 12px; }
  .sync-actions { gap: 8px; }
  .sync-actions .btn { flex: 1 1 auto; }
  .readonly-notice { padding: 15px; }
  .readonly-notice .btn { margin-left: 0; }
  .page-footer { padding: 14px 16px 24px; font-size: 14px; flex-direction: column; gap: 4px; }
  .draft-bar { padding: 14px; gap: 12px; bottom: 9px; }
  .draft-bar .actions { width: 100%; gap: 8px; }
  .draft-bar .actions .btn { flex: 1 1 auto; }
  .panel-footer { padding: 15px 16px; gap: 9px; }
  .stat-card { padding: 17px 14px; }
  .stats-grid { gap: 12px; }
  .stat-card strong { font-size: 28px; }
  .stat-card .stat-top { flex-wrap: wrap; }
  .filterbar { padding: 16px; }
  .filterbar .searchbox, .filterbar select { width: 100%; }
  .overlay { padding: 12px; }
  .modal { max-height: 94vh; max-height: 94dvh; }
  .modal-head, .modal-content, .modal-actions { padding: 20px 17px; }
  .modal-head h2 { font-size: 22px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-section { padding: 15px; }
  .log-item { padding: 18px 16px; gap: 12px; }
  .log-item time { margin-left: 52px; }
  .diff-row { gap: 10px; flex-wrap: wrap; }
  .diff-row .diff-values { text-align: left; width: 100%; }
  .permission-list { grid-template-columns: 1fr; }
  .detail-meta { gap: 17px 10px; padding: 14px; }
  .detail-buttons .btn { flex-basis: 100%; }
  .searchbox { width: 100%; }
  .publish-summary > div { padding: 14px 7px; }
  .publish-summary strong { font-size: 26px; }
  .rule-card { padding: 19px; }
  #toast { bottom: 20px; width: max-content; max-width: 90vw; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Six-module workbench; preserves the source prototype's blue, white and slate palette. */
:root { --sidebar-width: 224px; }
body { font-size: 14px; background: #f6f8fc; }
.sidebar { padding: 28px 16px 0; }
.brand { font-size: 28px; gap: 10px; padding: 0 9px; }
.brand-caption { font-size: 12px; letter-spacing: 1px; }
.brand-mark { width: 36px; height: 39px; border-radius: 11px; }
.wb-workspace { margin: 30px 9px 22px; color: #8792a5; font-size: 11px; letter-spacing: 1.5px; }
.sidebar nav { gap: 7px; }
.sidebar nav button { min-height: 47px; font-size: 14px; padding: 11px 14px; font-weight: 500; }
.sidebar nav button svg { width: 19px; height: 19px; }
.sidebar nav button.active { background: #edf1ff; color: #4263dc; font-weight: 650; }
.wb-nav-count { font-size: 11px; background: #fff; color: #677aa8; border-radius: 5px; padding: 0 6px; margin-left: auto; }
.wb-side-note { margin: auto 3px 18px; padding: 18px 11px 4px; font-size: 12px; color: #718099; }
.wb-side-note strong { display: block; font-size: 13px; color: #586b88; margin-bottom: 5px; }
.wb-side-note p { margin: 3px 0; }
.wb-profile { margin-top: auto; border-top: 1px solid #e7ebf3; display: flex; gap: 10px; align-items: center; padding: 19px 5px; }
.wb-profile small { display: block; font-size: 11px; color: #8590a3; }
.topbar { min-height: 68px; padding: 12px 32px; }
.topbar select { background: #fff; border: 1px solid #dce3ee; border-radius: 6px; padding: 6px; max-width: 150px; font-size: 12px; }
.demo-pill { font-size: 11px; padding: 4px 9px; }
.wb-breadcrumb { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #8b96aa; }
.wb-breadcrumb strong { color: #4b5c78; font-weight: 500; }
main { padding: 30px 32px; max-width: 1800px; }
.wb-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 0 23px; }
.wb-heading h1 { font-size: 25px; letter-spacing: -.6px; font-weight: 650; }
.wb-heading p { font-size: 13px; color: #8490a3; margin-top: 7px; }
.wb-heading .eyebrow { font-size: 10px; letter-spacing: 1.5px; color: #91a0b7; margin-bottom: 7px; }
.wb-tabs { display: flex; gap: 25px; border-bottom: 1px solid #dfe5ef; margin: 0 0 24px; overflow-x: auto; }
.wb-tabs button { white-space: nowrap; padding: 0 2px 13px; position: relative; color: #738198; font-size: 14px; min-height: 38px; }
.wb-tabs button.active { color: #4968e1; font-weight: 600; }
.wb-tabs button.active:after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; border-radius: 3px 3px 0 0; background: #4d6cf5; }
.wb-subtabs { display: flex; flex-wrap: wrap; gap: 7px; margin: -7px 0 20px; }
.wb-subtabs button { border: 1px solid #dce4ef; border-radius: 6px; padding: 5px 11px; color: #7a879d; font-size: 12px; background: #fff; }
.wb-subtabs button.active { border-color: #c9d4ff; background: #eef2ff; color: #4c68ce; }
.wb-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 15px; margin-bottom: 23px; }
.wb-stats-three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.wb-stat { background: #fff; border: 1px solid #e1e7f0; border-radius: 10px; padding: 19px 21px; position: relative; }
.wb-stat small { color: #7c8aa0; font-size: 12px; }
.wb-stat strong { display: block; color: #263b5b; font-size: 27px; font-weight: 600; line-height: 1.45; margin: 5px 0 2px; font-variant-numeric: tabular-nums; }
.wb-stat p { font-size: 11px; color: #9aa4b6; }
.wb-stat svg { position: absolute; top: 19px; right: 19px; width: 19px; color: #8ca1d2; }
.wb-panel { background: white; border: 1px solid #e0e6f0; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
.wb-panel-title { padding: 18px 21px; display: flex; align-items: center; gap: 10px; justify-content: space-between; border-bottom: 1px solid #eef1f7; }
.wb-panel-title h2 { font-size: 15px; font-weight: 600; }
.wb-panel-title small { color: #8c99ac; font-size: 11px; }
.wb-config-actions { flex-wrap: wrap; justify-content: flex-end; }
.wb-config-status { margin-right: 6px; }
/* Packages: current publication, pending edits, and superseded versions. */
.pk-heading { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin:0 0 12px; }
.pk-heading .wb-config-status { font-size:12px; color:#8190a6; }
.pk-status-tabs { display:flex; gap:6px; width:fit-content; max-width:100%; padding:5px; border:1px solid #e0e6f1; background:#ecf0f7; border-radius:10px; }
.pk-status-tabs button { display:flex; align-items:center; gap:9px; padding:9px 17px; border-radius:7px; color:#7d8ba1; font-size:13px; white-space:nowrap; }
.pk-status-tabs button.active { background:#fff; color:#4564dc; box-shadow:0 2px 7px #263e6d0b; font-weight:600; }
.pk-status-tabs button span { border-radius:5px; padding:1px 6px; font-size:11px; background:#e2e8f2; color:#8291a9; }
.pk-status-tabs button.active span { color:#5c77d7; background:#edf1ff; }
.pk-status-tabs button:focus-visible,.pk-card button:focus-visible { outline:2px solid #506be7; outline-offset:3px; }
.pk-catalog .wb-toolbar { padding:10px 0 20px; }
.pk-card-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-bottom:20px; }
.pk-card { position:relative; overflow:hidden; background:#fff; border:1px solid #e0e6f0; border-radius:13px; padding:22px 22px 0; min-width:0; display:flex; flex-direction:column; }
.pk-card:before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--package-color); }
.pk-card-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; }
.pk-card-top .wb-tag { font-size:11px; }
.pk-card h3 { font-size:21px; line-height:1.5; font-weight:650; color:#30415d; overflow-wrap:anywhere; }
.pk-card-id { font-size:10px; color:#9aa7b9; margin-top:4px; }
.pk-price { display:flex; align-items:baseline; gap:4px; margin-top:14px; color:#2c3d5b; font-variant-numeric:tabular-nums; }
.pk-price>span { font-size:19px; }.pk-price strong { font-size:37px; font-weight:650; letter-spacing:-1px; }.pk-price>small { margin-left:5px; font-size:12px; color:#8996ab; }
.pk-billing { color:#8b97aa; font-size:11px; margin:6px 0 15px; line-height:1.8; }
.pk-benefits { border-top:1px solid #edf0f6; padding:12px 0; color:#8390a6; font-size:12px; flex:1; }
.pk-benefits>div { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:7px 0; }
.pk-benefits strong { font-size:13px; font-weight:550; text-align:right; color:#536986; font-variant-numeric:tabular-nums; }
.pk-benefits small { font-size:10px; color:#929eb0; font-weight:400; }
.pk-card-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; border-top:1px solid #edf0f6; padding:16px 0; color:#96a2b5; font-size:10px; }
.pk-card-footer>div { display:flex; gap:14px; }.pk-card-footer .text-button { min-height:30px; font-size:12px; }.pk-draft-hint { color:#bd944b; }
.pk-empty { background:#fff; border:1px dashed #dce4ef; border-radius:12px; padding:60px 20px; text-align:center; grid-column:1/-1; color:#8c99ad; }
.pk-empty h3 { margin:14px 0 8px; font-size:17px; font-weight:600; color:#536581; }.pk-empty p { font-size:13px; line-height:1.9; }.pk-empty .btn { margin-top:22px; }
.pk-empty-icon { display:inline-flex; padding:13px; border-radius:13px; background:#f0f4fb; color:#94a6c6; }.pk-empty-icon svg { width:23px; height:23px; }
@media(max-width:1180px) { .pk-card-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }.pk-heading { align-items:flex-start; flex-wrap:wrap; } }
@media(max-width:600px) { .pk-card-grid { grid-template-columns:1fr; }.pk-status-tabs { width:100%; }.pk-status-tabs button { justify-content:center; flex:1; padding:9px 8px; }.pk-heading .heading-actions { justify-content:flex-start; }.pk-heading .wb-config-status { flex-basis:100%; }.pk-catalog .wb-toolbar label:first-child { min-width:100%; }.pk-card { padding:23px 23px 0; } }
.wb-task-result { padding: 22px; }
.wb-task-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; }
.wb-task-heading h3 { font-size:17px; font-weight:600; color:#344b6d; margin:0 0 7px; }
.wb-task-heading small { font-size:11px; color:#8997ad; }
.wb-task-section + .wb-task-section { border-top:1px solid #edf0f6; padding-top:24px; margin-top:24px; }
.wb-task-section h4 { font-size:14px; color:#3b5172; margin:0 0 16px; }

    for (const [before, after] of [
      ['独立演示管理员', '管理员'], ['演示管理员', '管理员'], ['演示运营', '运营'],
      ['演示可用', '可用'], ['演示失效', '已失效'], ['（本地演示）', ''], ['（演示）', ''],
      ['独立演示版', '独立原型'], ['演示文稿', 'PPT'], ['演示密钥', '示例密钥'],
      ['演示方案', '示例方案'], ['演示值', '示例值'], ['演示状态', '页面状态'],

      ['演示后台流程', '预览后台流程'], ['演示调级', '预览调级']
    ]) value = value.replaceAll(before, after);
    return value.replaceAll('演示', '');
  }

          "label": "说明 · 导出你存储的所有关于我的记忆，以及你从过去对话中",
          "value": "导出你存储的所有关于我的记忆，以及你从过去对话中了解到的所有上下文信息。尽可能逐字保留我的原话，尤其是涉及指令和偏好的部分。 ## 分类（请按以下顺序输出）： 1. **指令**：我明确要求你今后遵循的规则——语气、格式、风格、\"始终做 X\"、\"绝不做 Y\"，以及对你行为的纠正。仅包含来自存储记忆中的规则，不包含来自对话的内容。 2. **身份**：姓名、年龄、所在地、教育背景、家庭、人际关系、语言能力和个人兴趣。 3. **职业**：当前和过往的职位、公司以及主要技能领域。 4. **项目**：我实际参与构建或投入精力的项目。理想情况下每个项目一条。包含项目功能、当前状态以及关键决策。以项目名称或简短描述作为条目的开头。 5. **偏好**：广泛适用的观点、品味和工作风格偏好。 ## 格式： 使用分类标题作为每个类别的节标题。在每个类别内，每行一条记录，按日期从早到晚排列。每行格式为： [YYYY-MM-DD] - 条目内容。 如果日期未知，使用 [unknown] 代替。 ## 输出： - 将整个导出内容包裹在一个代码块中，方便复制。 - 在代码块之后，说明这是否是完整的记忆集合，还是还有更多未列出的。",

          "items": [
            {
              "id": "device-0",
              "question": "耳机无法被手机发现？",
              "answer": "将耳机放入充电仓并合盖，双击充电仓的蓝牙配对键，TFT屏显示\"配对模式\"后即可被手机发现并连接。",
              "category": "device",
              "status": "published",
              "order": 1
            },
            {
              "id": "device-2",
              "question": "经常断连怎么办？",
              "answer": "请检查手机与耳机之间无障碍物遮挡，尽量保持在10米范围内。如持续断连，尝试在蓝牙设置中\"忽略此设备\"后重新配对。",
              "category": "device",
              "status": "published",
              "order": 2
            },
            {
              "id": "device-4",
              "question": "可以同时连接多台设备吗？",
              "answer": "支持同时记忆2台设备，在设备间手动切换。如需切换，请在原设备断开蓝牙后在新设备连接。",
              "category": "device",
              "status": "published",
              "order": 3
            },
            {
              "id": "record-0",
              "question": "转写准确率不高怎么办？",
              "answer": "请尽量在安静环境中录音，说话清晰、语速适中。可在AI录音设置页添加热词（人名、专业术语），提升特定词汇识别率。",
              "category": "record",
              "status": "published",
              "order": 4
            },
            {
              "id": "record-2",
              "question": "支持哪些语言转写？",
              "answer": "支持中文普通话、英语、日语、韩语、法语、德语、西班牙语等10+语种。混合语种也会自动识别并分别转写。",
              "category": "record",
              "status": "published",
              "order": 5
            },
            {
              "id": "record-4",
              "question": "录音文件可以导出吗？",
              "answer": "支持导出为TXT、MP3、SRT字幕等格式。在录音详情页点击右上角分享按钮即可选择导出格式。",
              "category": "record",
              "status": "published",
              "order": 6
            },
            {
              "id": "translate-0",
              "question": "同声传译怎么用？",
              "answer": "进入翻译界面，选择\"对话同传\"模式，设置好源语言和目标语言即可开始。双方说话内容会实时互译并播报。",
              "category": "translate",
              "status": "published",
              "order": 7
            },
            {
              "id": "translate-2",
              "question": "没网络能用吗？",
              "answer": "翻译功能需联网使用，暂不支持离线翻译。",
              "category": "translate",
              "status": "published",
              "order": 8
            },
            {
              "id": "translate-4",
              "question": "支持哪些语种？",
              "answer": "在线翻译支持100+语种互译。",
              "category": "translate",
              "status": "published",
              "order": 9
            },
            {
              "id": "account-0",
              "question": "如何注册账号？",
              "answer": "打开App后点击\"注册\"，输入手机号码获取验证码，设置昵称和头像即可完成注册。",
              "category": "account",
              "status": "published",
              "order": 10
            },
            {
              "id": "account-2",
              "question": "如何升级会员？",
              "answer": "进入\"我的\"页面，点击会员卡片或\"查看方案\"，选择您需要的套餐（标准版/专业版/旗舰版），点击\"立即订阅\"完成支付即可。",
              "category": "account",
              "status": "published",
              "order": 11
            },
            {
              "id": "account-4",
              "question": "如何取消自动续费？",
              "answer": "iOS用户：系统设置→Apple ID→订阅→选择iDock→取消订阅。Android用户：Google Play/应用市场→订阅→取消。",
              "category": "account",
              "status": "published",
              "order": 12
            },
            {
              "id": "other-0",
              "question": "如何更新固件？",
              "answer": "进入\"我的设备\"页面，点击\"固件更新\"。请确保耳机在充电仓内且电量>50%，更新过程约3-5分钟。",
              "category": "other",
              "status": "published",
              "order": 13
            },
            {
              "id": "other-2",
              "question": "数据会丢失吗？",
              "answer": "录音和转写数据存储在您的手机本地和云端账户中，卸载App前请确保已备份重要数据。卸载App不会立即删除云端数据。",
              "category": "other",
              "status": "published",
              "order": 14
            },
            {
              "id": "other-4",
              "question": "隐私政策在哪里看？",
              "answer": "\"我的\"→\"关于\"页面底部可查看隐私政策概要、个人信息清单、第三方信息共享清单、用户服务协议及隐私政策全文。",
              "category": "other",
              "status": "published",
              "order": 15
            }
          ],
          "note": "原型中部分语言数量、导出格式与当前页面不一致，保留原文，需业务确认。"
        }
      ]
    },

          "id": "policy-privacy-summary-title",

        {
          "id": "policy-privacy-summary-body",
          "page": "policy-privacy-summary",
          "label": "文档正文",
          "value": "一、引言\n本隐私政策概要旨在以简明易懂的方式向您说明我们如何收集、使用、存储和保护您的个人信息。完整内容请参阅《隐私政策》全文。\n二、我们收集的信息\n1. 账户信息：手机号码、昵称、头像。\n2. 设备信息：设备型号、操作系统版本、唯一设备标识符。\n3. 使用数据：使用时长、功能偏好、语音交互记录（经加密处理）。\n4. 位置信息：在您授权后获取的大致位置信息。\n5. 语音数据：用于AI声音克隆和语音识别的录音样本。\n三、信息使用\n1. 提供AI耳机核心功能服务（语音播报、智能对话等）。\n2. 优化产品体验，改进AI模型和服务质量。\n3. 提供设备管理、固件更新等基础服务。\n4. 保障账户安全，防范风险。\n四、信息存储与保护\n我们采用行业标准的加密技术（如AES-256）对您的个人信息进行加密存储，数据存储在位于中华人民共和国境内的服务器上，保存期限不超过实现服务目的所必需的时间。\n五、您的权利\n1. 查询、更正、删除您的个人信息。\n2. 撤回授权同意。\n3. 注销账户。\n4. 获取个人信息副本。\n六、联系我们\n如您对本隐私政策有任何疑问，请通过企业微信客服联系我们。",
          "type": "textarea",
          "source": {
            "file": "IDockAPP_Mine.html",

        {
          "id": "policy-info-list-body",
          "page": "policy-info-list",
          "label": "文档正文",
          "value": "一、注册与登录\n• 手机号码：用于账户注册、登录验证。\n• 昵称：用于个人展示。\n• 头像：用于个人形象展示。\n• 用户ID：系统自动生成，用于身份标识。\n二、设备管理\n• 设备名称：用于设备识别。\n• 设备型号：用于兼容性适配。\n• 蓝牙地址：用于设备连接。\n• 固件版本：用于固件更新服务。\n三、AI功能服务\n• 语音录音：用于AI声音克隆、语音识别。\n• 音色偏好：用于个性化语音播报。\n• 音高/语速设置：用于音色调节。\n• 对话记录：用于AI对话上下文理解（可手动删除）。\n四、设备与日志\n• 操作系统版本：用于兼容性适配。\n• 网络状态：用于网络连接诊断。\n• 操作日志：用于故障排查和安全审计。\n• 崩溃日志：用于问题定位和修复。\n五、可选授权信息\n• 位置信息：用于位置相关服务（可选）。\n• 通讯录：用于联系人识别（可选）。\n• 通知权限：用于消息播报（可选）。\n• 摄像头/相册：用于图片识别与存储（可选）。\n注：以上信息均在您授权后收集，您可随时在设置中关闭相关权限。",

        {
          "id": "policy-third-party-body",
          "page": "policy-third-party",
          "label": "文档正文",
          "value": "一、第三方SDK清单\n为实现核心功能，我们集成了以下第三方SDK：\n1. 微信开放平台SDK\n• 使用目的：微信登录、分享、支付\n• 收集信息：设备标识符、网络信息\n• 提供方：深圳市腾讯计算机系统有限公司\n• 隐私政策：weixin.qq.com/cgi-bin/readtemplate?t=weixin_agreement\n2. 支付宝SDK\n• 使用目的：支付服务\n• 收集信息：设备标识符、订单信息\n• 提供方：支付宝（中国）网络技术有限公司\n• 隐私政策：render.alipay.com/p/yuyan/180020010001196791/preview.html\n3. 极光推送SDK\n• 使用目的：消息推送\n• 收集信息：设备标识符、网络信息\n• 提供方：和冠智能科技（深圳）有限公司\n• 隐私政策：www.jiguang.cn/license/privacy\n4. 腾讯Bugly SDK\n• 使用目的：崩溃监控\n• 收集信息：设备信息、崩溃日志\n• 提供方：深圳市腾讯计算机系统有限公司\n• 隐私政策：bugly.qq.com/v2/contract\n5. 阿里云SDK\n• 使用目的：云存储、内容分发（CDN）、短信验证码\n• 收集信息：设备标识符、网络信息、手机号码\n• 提供方：阿里云计算有限公司\n• 隐私政策：help.aliyun.com/document_detail/424088.html\n6. 火山引擎SDK\n• 使用目的：AI语音识别、语音合成、大模型推理\n• 收集信息：语音数据、设备标识符、网络信息\n• 提供方：北京火山引擎科技有限公司\n• 隐私政策：www.volcengine.com/docs/6436/privacy\n二、第三方服务\n1. 云服务器\n• 使用目的：数据存储与计算\n• 提供方：阿里云计算有限公司\n2. AI语音服务\n• 使用目的：语音识别与合成\n• 提供方：北京百度网讯科技有限公司\n三、共享原则\n1. 我们仅在为您提供服务所必需的范围内与第三方共享信息。\n2. 我们要求第三方采取至少与我们同等的隐私保护措施。\n3. 未经您的同意，我们不会将您的个人信息共享给上述清单之外的第三方。",

 function validateMembership(m){

  for(const [pk,bk,gk] of [['published','benefits','groups'],['draft','draftBenefits','draftGroups']]){
   if(!Array.isArray(m[bk])||!Array.isArray(m[gk])){errors.push('权益与分组缺失');continue;}
   for(const list of [m[pk],m[bk],m[gk]])if(list.some(x=>!x||!C.idOK(x.id)||typeof x.name!=='string')||new Set(list.map(x=>x.id)).size!==list.length)errors.push('会员、权益或分组标识无效');
   if(!m[pk].some(p=>p.id==='luna'))errors.push('缺少 Luna 基础等级');
   for(const b of m[bk])if(!['quota','toggle','promo'].includes(b.type)||!m[gk].some(g=>g.id===b.group)||typeof b.unit!=='string')errors.push('权益类型、单位或分组无效');

  for(const l of m.logs)if(!l||typeof l.title!=='string'||typeof l.detail!=='string'||typeof l.time!=='string')errors.push('会员记录格式无效');

  errors.push(...(window.RedemptionCodes?.validateStore(m)||[]),...(window.TierSchemes?.validate(m)||[]));

 function readImage(el){

  const box=el.closest('.mine-image-field'),input=box?.querySelector(el.dataset.imageItem==='true'?'[name]':'[data-content-field]'),file=el.files?.[0];

    if(window.TierSchemes){
      for(const r of out)if(r.kind==='membership'||r.kind==='ops'&&r.key==='packages'){r.legacy=true;r.current=false;}
      for(const t of Object.values(window.TierSchemes.read().tiers))for(const h of t.history)out.push({kind:'tier',key:t.id,revision:h.revision,name:h.snapshot.plan.name+' · '+h.snapshot.plan.label,module:'membership',current:h.revision===t.revision,snapshot:copy(h.snapshot),changes:copy(h.changes),time:h.time,actor:h.actor||'未记录',reason:h.reason,recordType:h.origin==='baseline'?'初始快照':'方案发布',origin:h.origin});
    }
    for(const d of window.MineCatalog.modules)for(const h of content.modules[d.id].history)out.push({kind:'content',key:d.id,revision:h.revision,name:d.name,module:d.id==='devices'?'devices':'content',legacy:d.id==='devices',current:d.id!=='devices'&&h.revision===content.modules[d.id].revision,snapshot:copy(h.content),changes:copy(h.changes||[]),...meta(h,content.logs,l=>l.type==='publish'&&l.module===d.id&&l.revision===h.revision)});
    for(const b of member.redemption?.batches||[]){
      const h=b.release;
      if(!h)continue;
      out.push({kind:'codes',key:b.id,revision:h.revision,name:'兑换码 · '+h.snapshot.name,module:'membership',current:true,snapshot:copy(h.snapshot),changes:[],time:h.time||'',actor:h.actor||'未记录（旧版）',reason:h.reason,recordType:'生成归档',origin:h.origin,batchState:b.disabled?'批次已停用':b.expiresOn<window.RedemptionCodes.today()?'已过期':'批次启用'});
    }
    return out.filter(r=>W.can('view',r.module)).map(r=>({...r,id:r.kind+':'+r.key+':'+r.revision,versionLabel:'v'+r.revision,versionState:r.legacy?'早期记录':r.kind==='codes'?r.batchState:r.current?'当前版本':'历史版本'})).sort((a,b)=>(b.time||'').localeCompare(a.time||'')||b.revision-a.revision);
  }
  function find(kind,key,revision){const r=entries().find(r=>r.kind===kind&&r.key===key&&r.revision===Number(revision));if(!r)throw Error('历史记录不存在或无查看权限');return r;}
  function render(){
    const rows=entries();
    return stats([['历史记录',rows.length,'包含发布版本与生成归档'],['方案发布',rows.filter(r=>r.recordType==='方案发布').length,'每次发布追加新版本'],['兑换码方案',rows.filter(r=>r.kind==='codes').length,'生成后保留权益与限制'],['初始快照',rows.filter(r=>r.recordType==='初始快照').length,'不计为实际发布']])+
      list('releases','方案发布历史',['方案 / 记录类型','所属模块','版本 / 状态','发布人 / 时间','发布说明','操作'],rows,r=>[
        `<strong>${esc(r.name)}</strong><small>${esc(r.recordType)}</small>`,esc(names[r.module]),`${r.versionLabel}<small>${tag(r.versionState)}</small>`,esc(r.actor)+`<small>${esc(r.time||'时间未记录')}</small>`,`<div class="rh-reason">${esc(r.reason)}</div>`,action('查看版本','detail',r.kind,r.key,r.revision)
      ],{extra:[['module','模块',Object.entries(names)],['recordType','记录类型',['方案发布','生成归档','初始快照']],['versionState','版本状态',['当前版本','历史版本','早期记录','批次启用','批次已停用','已过期']],['actor','发布人',[...new Set(rows.map(r=>r.actor))]]],date:'time',dateLabel:'发布时间',placeholder:'方案名称、编号、版本号或发布说明'});
  }
  function openHistory(kind,key){
    if(kind==='tier')return window.TierSchemeUI.open(key);
    const rows=entries().filter(r=>r.kind===kind&&(!key||r.key===key));
    const title=kind==='codes'?'兑换码方案历史':rows[0]?.name||'方案发布历史';
    B.modal(title,'',rawTable(['版本 / 方案','记录类型 / 状态','发布人 / 时间','发布说明','操作'],rows.map(r=>[esc(r.versionLabel+' · '+r.name),esc(r.recordType)+`<small>${tag(r.versionState)}</small>`,esc(r.actor)+`<small>${esc(r.time||'时间未记录')}</small>`,esc(r.reason),action('查看完整方案','detail',r.kind,r.key,r.revision)])),action('关闭','close','','',null,'btn'),{wide:true});
  }
  function rowSnapshots(rows,context){return rows.length?rows.map(r=>`<details class="rh-object" open><summary>${esc(r.name||r.version||r.id)} <small>${esc(r.id)}</small></summary>${rawTable(['配置项','当时的值'],Object.entries(r).map(([key,v])=>[esc(key==='duration'&&context==='packages'?'购买时长（月）':key==='duration'&&context==='giftPlans'?'有效期（天）':labels[key]||key),value(v)]))}</details>`).join(''):note('该版本没有方案条目。');}
  function memberSnapshot(s){
    return panel('等级与权益 · 当时的配置',rawTable(['权益',...s.plans.map(p=>esc(p.name))],s.benefits.map(b=>[esc(b.name)+`<small>${esc(window.MineTerms.unit(b))}</small>`,...s.plans.map(p=>value(p.values?.[b.id]))])))+
      panel('等级资料',rowSnapshots(s.plans.map(({values,...p})=>p)))+panel('权益定义与规则',rowSnapshots(s.benefits))+panel('权益分组',rowSnapshots(s.groups))+
      (Object.keys(s.migrations||{}).length?panel('本次等级迁移',value(s.migrations)):'');
  }
  function snapshotHTML(r){
    if(r.kind==='tier')return rowSnapshots(r.snapshot.packages,'packages')+memberSnapshot({plans:[r.snapshot.plan],benefits:r.snapshot.benefits,groups:r.snapshot.groups});
    if(r.kind==='membership')return memberSnapshot(r.snapshot);
    if(r.kind==='ops')return rowSnapshots(r.snapshot,r.key)+(r.references?`<details class="rh-object"><summary>当时关联的会员配置 · v${esc(r.references.revision)}</summary>${memberSnapshot(r.references)}</details>`:'');
    if(r.kind==='codes')return panel('每码权益',rowSnapshots(r.snapshot.rewards))+panel('生成与兑换规则',rawTable(['配置项','生成时的值'],Object.entries(r.snapshot).filter(([k])=>k!=='rewards').map(([k,v])=>[esc(labels[k]||k),value(v)])))+note('该批次权益固定。需要其他权益时新建批次；停用和兑换操作不会改写本条方案快照。');
    const d=window.MineCatalog.modules.find(d=>d.id===r.key),s=r.snapshot;
    return panel('公共配置',rawTable(['配置项','当时的值'],Object.entries(s.fields).map(([k,v])=>[esc(d.fields.find(f=>f.id===k)?.label||k),value(v)])))+Object.entries(s.collections).map(([k,rows])=>{
      const c=d.collections.find(c=>c.id===k);return panel(c?.name||k,rows.length?rows.map(row=>`<details class="rh-object" open><summary>${esc(row.name||row.question||row.id)}</summary>${rawTable(['配置项','当时的值'],Object.entries(row).map(([field,v])=>[esc(c?.fields.find(f=>f.id===field)?.label||labels[field]||field),value(v)]))}</details>`).join(''):note('该版本无条目。'));
    }).join('');
  }
  function diffHTML(r){
    return r.changes.length?rawTable(['对象 / 配置项','发布前','发布后'],r.changes.map(c=>[esc(c.label||[c.id,labels[c.field]||c.field].filter(Boolean).join(' · ')),value(c.before),value(c.after)])):note(r.kind==='codes'?'首次生成归档，完整规则见方案快照。':r.recordType==='初始快照'?'初始快照没有前一版本可比较。':'旧版没有保存结构化差异；完整方案快照仍可查看。');
  }
  function openVersion(kind,key,revision,tab='snapshot'){
    const r=find(kind,key,revision);if(kind==='tier')return window.TierSchemeUI.open(key,r.current?'current':r.revision);selected={kind,key,revision:r.revision};
    const tabs=`<div class="wb-subtabs rh-tabs">${action('完整方案','snapshot',kind,key,r.revision,tab==='snapshot'?'active':'')}${action('发布差异（'+r.changes.length+'）','diff',kind,key,r.revision,tab==='diff'?'active':'')}</div>`;
    const metaHTML=kv([['方案',r.name],['版本',r.versionLabel+' · '+r.versionState],['记录类型',r.recordType],['发布人 / 生成人',r.actor],['发布时间 / 生成时间',r.time||'未记录（旧版）'],['发布说明 / 用途',r.reason]]);
    B.modal((r.kind==='ops'&&r.key==='packages'&&r.current?'当前发布 · ':'方案历史 · ')+r.versionLabel,r.name+' · 只读快照',metaHTML+tabs+`<div class="rh-snapshot">${tab==='snapshot'?snapshotHTML(r):diffHTML(r)}</div>`,action('返回历史','history',kind,key,null,'btn')+(r.kind!=='codes'&&!r.legacy&&!(r.kind==='ops'&&r.key==='packages'&&r.current)?action(r.kind==='ops'&&r.key==='packages'?'恢复为草稿':'恢复为编辑稿','restore',kind,key,r.revision,'btn',W.can('edit',r.module)?'':'disabled'):'')+action('关闭','close','','',null,'btn'),{wide:true});
  }
  function restoreReview(r){
    if(r.kind==='codes'||r.legacy||!W.can('edit',r.module))throw Error('当前账号无此操作权限');
    selected={kind:r.kind,key:r.key,revision:r.revision};
    B.modal('恢复历史方案为编辑稿',r.name+' · '+r.versionLabel,note('将替换本方案当前尚未发布的编辑内容。当前生效版本、已发布历史、用户权益、兑换结果和支付记录保持不变。检查并重新发布后，系统会新增一个版本。')+'<div id="rh-error" class="form-error" role="alert"></div>',action('取消','detail',r.kind,r.key,r.revision,'btn')+action('确认恢复为编辑稿','confirm-restore',r.kind,r.key,r.revision,'btn primary'),{wide:true});
  }
  function restore(r){
    if(r.kind==='codes'||r.legacy||!W.can('edit',r.module))throw Error('当前账号无此操作权限');
    const ok=r.kind==='membership'?B.restoreConfig(r.revision):r.kind==='ops'?W.restoreHistory(r.key,r.revision):M.restoreHistory(r.key,r.revision);
    if(!ok)throw Error('恢复未保存，请检查存储或权限后重试；原数据保持不变。');
    B.close();if(r.kind==='ops'&&r.key==='packages')W.navigate('packages-drafts');W.refresh();B.toast('已恢复为编辑稿，检查并重新发布后产生新版本');
  }
  document.addEventListener('click',event=>{
    const el=event.target.closest('[data-rh]');if(!el||el.disabled)return;
    const {rh,kind,key,revision}=el.dataset;
    try{
      if(rh==='close')return B.close();
      if(rh==='history')return openHistory(kind,key);
      if(['detail','snapshot','diff'].includes(rh))return openVersion(kind,key,Number(revision),rh==='diff'?'diff':'snapshot');
      if(rh==='restore')return restoreReview(find(kind,key,revision));
      if(rh==='confirm-restore'&&selected)return restore(find(selected.kind,selected.key,selected.revision));
    }catch(e){const error=document.querySelector('#rh-error');if(error)error.textContent=e.message;B.toast(e.message);}
  });
  window.PublicationHistory={entries,render,openHistory,openVersion};
  W.refresh();
})();
</script>
</body></html>
