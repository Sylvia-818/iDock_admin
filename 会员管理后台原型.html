  'export-legacy': () => { try { const raw = localStorage.getItem(LEGACY_KEY); if (!raw) return toast('未找到旧版备份'); exportJSON('iDock-旧版本地备份.json', JSON.parse(raw)); } catch (_) { toast('旧版备份无法读取'); } },
  'review-latest': reviewLatest,
  'load-latest': async () => { if (await fetchState(true)) close(); },
  'retry-sync': () => fetchState()
};
document.addEventListener('click', event => {
  const nav = event.target.closest('[data-nav]'); if (nav) { navigate(nav.dataset.nav); return; }
  const element = event.target.closest('[data-action]'); if (!element || element.disabled) return;
  if (mutatingActions.has(element.dataset.action) && (!canEdit || !loaded || busy)) return toast('请先登录或等待保存完成');
  actions[element.dataset.action]?.(element);
});
document.addEventListener('input', event => {
  const element = event.target;
  if (element.dataset.quota && canEdit && !busy) {
    const number = Number(element.value); if (element.value.trim() && Number.isFinite(number) && number >= 0 && number <= 100000000 && element.validity.valid) { state.draft.find(plan => plan.id === element.dataset.plan).values[element.dataset.quota] = number; markDirty(); refreshEditingUI(element); }
  }
  if (element.id === 'benefit-search') { query = element.value; $('#matrix-wrap').innerHTML = matrix(); }
  if (element.id === 'user-search') { userQuery = element.value; selected.clear(); $('#users-wrap').innerHTML = userTable(); }
});
document.addEventListener('change', event => {
  const element = event.target;
  if (element.dataset.quota) {
    const plan = state.draft.find(plan => plan.id === element.dataset.plan), id = element.dataset.quota, value = Number(element.value);
    if (!canEdit || busy || !element.value.trim() || !Number.isFinite(value) || value < 0 || value > 100000000 || !element.validity.valid) { element.value = plan.values[id]; return toast('请输入 0 到 100,000,000 之间的额度'); }
    plan.values[id] = value; markDirty(); refreshEditingUI(element);
  }
  if (element.dataset.promo && canEdit && !busy) { state.draft.find(plan => plan.id === element.dataset.plan).values[element.dataset.promo] = element.value; markDirty(); render(); }
  if (element.id === 'user-plan') { userPlan = element.value; selected.clear(); $('#users-wrap').innerHTML = userTable(); }
  if (element.id === 'user-status') { userStatus = element.value; selected.clear(); $('#users-wrap').innerHTML = userTable(); }
  if (element.dataset.userCheck) { element.checked ? selected.add(element.dataset.userCheck) : selected.delete(element.dataset.userCheck); $('#users-wrap').innerHTML = userTable(); }
  if (element.id === 'select-all') { filteredUsers().forEach(user => element.checked ? selected.add(user.id) : selected.delete(user.id)); $('#users-wrap').innerHTML = userTable(); }
});
document.addEventListener('keydown', event => {
  if (!$('.modal')) return;
  if (event.key === 'Escape' && !busy) { close(); event.preventDefault(); }
  if (event.key === 'Tab') { const list = [...$('.modal').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex="0"]')].filter(element => element.getClientRects().length); if (!list.length) return; const first = list[0], last = list[list.length - 1]; if (event.shiftKey && (document.activeElement === first || document.activeElement === $('.modal'))) { last.focus(); event.preventDefault(); } else if (!event.shiftKey && (document.activeElement === last || document.activeElement === $('.modal'))) { first.focus(); event.preventDefault(); } }
});
window.addEventListener('hashchange', () => { const next = location.hash.slice(1); if (['plans', 'users', 'rules', 'logs'].includes(next) && view !== next) { view = next; render(); } });
window.addEventListener('beforeunload', event => { if (ONLINE && isDirty()) { event.preventDefault(); event.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fetchState(); });
$('#help').onclick = guide; $('#guide-link').onclick = guide;
render();
if (ONLINE) { fetchState(); setInterval(() => { if (document.visibilityState !== 'hidden') fetchState(); }, 5000); }
})();
</script>
</body></html>
